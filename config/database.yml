default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", "5432") %>
  username: <%= ENV.fetch("DB_USERNAME") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "workspace_hub_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "workspace_hub_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") %>
